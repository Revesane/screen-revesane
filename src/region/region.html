<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="Screen Revesane — выделение области">Screen Revesane — выделение области</title>
    <style>
      /* Цвета темы: region.js подставляет акцент выбранной темы из адреса окна. */
      :root { --acc: 54 203 176; --acc-ink: #06231f; --acc-hi: #8df0dc; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: transparent; cursor: crosshair;
        font-family: "Segoe UI", system-ui, sans-serif; user-select: none;
      }
      /* Замороженный снимок экрана: подложка вместо живого рабочего стола.
         object-fit: fill — размер картинки задаёт main ровно по дисплею, иначе
         cover сжимал её по высоте и выделение не совпадало с кадром. */
      #backdrop {
        position: fixed; inset: 0;
        width: 100%; height: 100%;
        object-fit: fill; object-position: top left;
        pointer-events: none;
      }
      #backdrop[hidden] { display: none; }
      /* Подсказка и кнопки должны быть выше затемнения рамки: box-shadow у #sel
         рисуется над всем, что идёт раньше в разметке, и гасил их. */
      #hint {
        position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
        z-index: 20;
        padding: 10px 18px; border-radius: 14px; text-align: center; line-height: 1.55;
        background: rgba(21, 27, 35, 0.94); border: 1px solid rgb(var(--acc) / 0.45);
        color: #e6edf3; font-size: 13.5px; letter-spacing: 0.2px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); pointer-events: none;
        transition: opacity 120ms ease;
      }
      #hint b { color: rgb(var(--acc)); font-weight: 600; }
      #hint .hint-sub { color: #8b98a9; font-size: 12px; }
      #hint kbd {
        display: inline-block; padding: 2px 7px; border-radius: 6px;
        background: rgb(var(--acc) / 0.16); border: 1px solid rgb(var(--acc) / 0.4);
        font: 600 11.5px/1.35 "Consolas", monospace; color: var(--acc-hi);
      }

      /* Рамка остаётся после отпускания: внутри почти прозрачно, снаружи затемнение. */
      #sel {
        position: fixed; display: none; pointer-events: none;
        /* Пунктир: рамка выделения отличается от рамки окна на экране. */
        border: 2px dashed rgb(var(--acc));
        background: rgb(var(--acc) / 0.02);
        box-shadow: 0 0 0 9999px rgba(8, 10, 13, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.45) inset;
      }
      #sel.on { display: block; }

      #size {
        position: absolute; right: -1px; bottom: -26px;
        padding: 3px 8px; border-radius: 6px;
        background: rgb(var(--acc)); color: var(--acc-ink);
        font: 600 12px/1.2 "Consolas", monospace; white-space: nowrap;
      }

      /* Ручки появляются только когда рамку можно править. */
      .grip {
        position: absolute; display: none; pointer-events: auto;
        background: rgb(var(--acc)); border-radius: 3px;
        box-shadow: 0 0 0 2px rgba(6, 35, 31, 0.55);
      }
      #sel.adjust .grip,
      #sel.adjust #move { display: grid; }

      .grip[data-dir="nw"] { left: -7px; top: -7px; width: 12px; height: 12px; cursor: nwse-resize; }
      .grip[data-dir="ne"] { right: -7px; top: -7px; width: 12px; height: 12px; cursor: nesw-resize; }
      .grip[data-dir="se"] { right: -7px; bottom: -7px; width: 12px; height: 12px; cursor: nwse-resize; }
      .grip[data-dir="sw"] { left: -7px; bottom: -7px; width: 12px; height: 12px; cursor: nesw-resize; }
      .grip[data-dir="n"] { left: 50%; top: -30px; width: 40px; height: 10px; margin-left: -20px; cursor: ns-resize; }
      .grip[data-dir="s"] { left: 50%; bottom: -6px; width: 40px; height: 10px; margin-left: -20px; cursor: ns-resize; }
      .grip[data-dir="w"] { left: -6px; top: 50%; width: 10px; height: 40px; margin-top: -20px; cursor: ew-resize; }
      .grip[data-dir="e"] { right: -6px; top: 50%; width: 10px; height: 40px; margin-top: -20px; cursor: ew-resize; }
      /* Верхняя ручка не должна спорить с крестиком за место. */
      .grip[data-dir="n"] { left: 22%; margin-left: -20px; }
      #sel.narrow .grip[data-dir="n"] { display: none; }

      /* Крестик на верхней линии: переносит рамку целиком. */
      #move {
        position: absolute; left: 50%; top: -30px; margin-left: -14px;
        width: 28px; height: 28px; border-radius: 50%;
        display: none; place-items: center; pointer-events: auto;
        background: rgba(21, 27, 35, 0.94); border: 1px solid rgb(var(--acc) / 0.7);
        color: rgb(var(--acc)); font-size: 15px; line-height: 1; cursor: move;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      }
      #move:hover { background: rgb(var(--acc) / 0.18); }
      /* Рамка у верхнего края экрана: крестик переезжает внутрь. */
      #sel.grip-inside #move { top: 6px; }
      #sel.grip-inside .grip[data-dir="n"] { display: none; }

      /* Кнопки подтверждения — внизу экрана, чтобы не зависеть от места рамки. */
      /* Выбор формата записи: только для видео, живёт рядом с кнопками. */
      #fmt-wrap {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 12px;
        border-radius: 12px;
        background: rgba(21, 27, 35, 0.94);
        border: 1px solid rgba(41, 52, 66, 0.95);
        color: #8b98a9;
        font: 600 11.5px/1 "Segoe UI", system-ui, sans-serif;
        letter-spacing: 0.3px;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
      }
      #fmt-wrap[hidden] {
        display: none;
      }
      #format {
        background: rgba(12, 16, 21, 0.92);
        color: #e6edf3;
        border: 1px solid rgb(var(--acc) / 0.35);
        border-radius: 8px;
        padding: 6px 8px;
        font: 600 12px/1 "Segoe UI", system-ui, sans-serif;
        outline: none;
        cursor: pointer;
      }
      #format:focus {
        border-color: rgb(var(--acc));
      }

      #actions {
        position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
        z-index: 20;
        display: flex; gap: 10px; align-items: center;
      }
      #actions[hidden] { display: none; }
      /* Рамка выделена: кнопки и подсказка «приклеены» к ней (координаты
         ставит region.js), а не висят у краёв экрана. */
      #actions.docked { bottom: auto; transform: none; }
      /* Вспышка рамки и всплывающая отметка «снимок сохранён». */
      #sel.flash::after {
        content: ""; position: absolute; inset: 0; background: #fff;
        animation: snap-flash 420ms ease-out forwards; pointer-events: none;
      }
      @keyframes snap-flash { from { opacity: 0.75; } to { opacity: 0; } }
      #snap-note {
        position: fixed; z-index: 30; padding: 8px 14px; border-radius: 10px;
        background: rgba(21, 27, 35, 0.96); border: 1px solid rgb(var(--acc) / 0.6);
        color: #e6edf3; font: 600 13px/1.3 "Segoe UI", system-ui, sans-serif;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.5); pointer-events: none;
        transition: opacity 200ms ease;
      }
      #snap-note[hidden] { display: none; }
      #snap-note.is-error { border-color: rgba(239, 83, 80, 0.7); }

      /* Кадр экрана с рамкой видео: поверх него выделяется снимок. */
      #snap-layer {
        position: fixed; inset: 0; width: 100%; height: 100%;
        object-fit: fill; z-index: 25; pointer-events: none;
      }
      #snap-layer[hidden] { display: none; }
      body.snap-mode #sel { z-index: 30; }
      body.snap-mode #actions, body.snap-mode #hint { z-index: 35; }
      #snap-note { z-index: 40; }
      /* Режим снимка внутри выделения видео: рамка жёлтая, свои кнопки. */
      .snap-only { display: none !important; }
      body.snap-mode .snap-only { display: inline-flex !important; }
      body.snap-mode #fmt-wrap,
      body.snap-mode #accept,
      body.snap-mode #snap,
      body.snap-mode #cancel { display: none !important; }
      body.snap-mode #sel { border-color: #ffd166; }
      body.snap-mode .grip { background: #ffd166; }
      body.snap-mode #size { background: #ffd166; color: #2a1f00; }
      body.snap-mode #move { border-color: rgba(255, 209, 102, 0.8); color: #ffd166; }
      body.snap-mode #hint { border-color: rgba(255, 209, 102, 0.6); }
      body.snap-mode #hint b, body.snap-mode #hint kbd { color: #ffd166; }
      body.snap-mode #snap-take { background: #ffd166; border-color: #ffe39a; color: #2a1f00; box-shadow: 0 0 22px rgba(255, 209, 102, 0.35), 0 10px 26px rgba(0, 0, 0, 0.45); }
      body.snap-mode #snap-take kbd { color: #2a1f00; background: rgba(42, 31, 0, 0.12); border-color: rgba(42, 31, 0, 0.25); }
      #hint.docked { transform: none; }

      /* Красная точка REC на кнопке записи: пульсирует, как индикатор эфира. */
      /* Красная плашка «● REC» на кнопке записи. */
      .rec-dot {
        display: inline-flex; align-items: center; gap: 5px;
        height: 20px; padding: 0 8px 0 6px; border-radius: 10px;
        /* Белая плашка с красным: читается на кнопке любой темы, и на красной тоже. */
        background: #fff; color: #e5262b;
        font: 800 10.5px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: 0.6px;
        box-shadow: 0 0 10px rgba(229, 38, 43, 0.45);
      }
      .rec-dot[hidden] { display: none; }
      .rec-dot::before {
        content: ""; width: 8px; height: 8px; border-radius: 50%;
        background: #e5262b; animation: rec-pulse 1.3s ease-in-out infinite;
      }
      .rec-dot::after { content: "REC"; }
      @keyframes rec-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      @media (prefers-reduced-motion: reduce) { .rec-dot { animation: none; } }
      /* display: inline-flex у .act перебивает атрибут hidden из UA-стилей,
         поэтому скрытая кнопка «Копировать» оставалась видимой. */
      .act[hidden] { display: none; }
      .act {
        display: inline-flex; align-items: center; gap: 9px;
        height: 44px; padding: 0 20px; border-radius: 12px; cursor: pointer;
        font: 600 13.5px/1 "Segoe UI", system-ui, sans-serif;
        border: 1px solid rgba(41, 52, 66, 0.95);
        background: rgba(21, 27, 35, 0.94); color: #b9c6d4;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
      }
      .act:hover { color: #e6edf3; }
      /* Кнопка подтверждения того же цвета, что и рамка, и с мягким свечением:
         раньше её просто не замечали. */
      .act.primary {
        background: rgb(var(--acc)); border-color: var(--acc-hi); color: var(--acc-ink);
        box-shadow: 0 0 0 1px rgb(var(--acc) / 0.45), 0 0 26px rgb(var(--acc) / 0.35),
          0 10px 26px rgba(0, 0, 0, 0.45);
      }
      .act.primary:hover { filter: brightness(1.08); }
      .act kbd {
        font: 600 11px/1 "Consolas", monospace;
        padding: 4px 7px; border-radius: 6px;
        background: rgba(6, 35, 31, 0.16); border: 1px solid rgba(6, 35, 31, 0.22);
        color: var(--acc-ink);
      }
      .act:not(.primary) kbd {
        background: rgba(255, 255, 255, 0.07); border-color: rgba(255, 255, 255, 0.14);
        color: #b9c6d4;
      }
    </style>
  </head>
  <body>
    <img id="backdrop" alt="" hidden />
    <div id="hint"><span data-i18n="Тяните рамку мышью ·">Тяните рамку мышью ·</span> <b>Esc</b> <span data-i18n="— отмена">— отмена</span></div>
    <div id="actions" hidden>
      <label id="fmt-wrap" hidden>
        <span data-i18n="Формат">Формат</span>
        <select id="format"></select>
      </label>
      <button id="accept" class="act primary"><span class="rec-dot" id="rec-dot" hidden></span><span id="accept-label" data-i18n="Готово">Готово</span><kbd id="accept-key">Enter</kbd></button>
      <button id="snap" class="act" hidden title="Снимок этой рамки — окно выделения останется открытым" data-i18n-title="Снимок этой рамки — окно выделения останется открытым"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="Снимок">Снимок</span><kbd id="snap-key">F6</kbd></button>
      <button id="snap-take" class="act primary snap-only"><span data-i18n="Снять">Снять</span><kbd id="snap-take-key">Enter</kbd></button>
      <button id="snap-copy" class="act snap-only"><span data-i18n="Копировать">Копировать</span><kbd>Ctrl+C</kbd></button>
      <button id="snap-back" class="act snap-only"><span data-i18n="Назад к видео">Назад к видео</span><kbd>Esc</kbd></button>
      <button id="copy" class="act"><span data-i18n="Копировать">Копировать</span><kbd>Ctrl+C</kbd></button>
      <button id="cancel" class="act"><span data-i18n="Отмена">Отмена</span><kbd>Esc</kbd></button>
    </div>
    <div id="snap-note" hidden></div>
    <img id="snap-layer" alt="" hidden />
    <div id="sel">
      <div class="grip" data-dir="nw"></div>
      <div class="grip" data-dir="n"></div>
      <div class="grip" data-dir="ne"></div>
      <div class="grip" data-dir="e"></div>
      <div class="grip" data-dir="se"></div>
      <div class="grip" data-dir="s"></div>
      <div class="grip" data-dir="sw"></div>
      <div class="grip" data-dir="w"></div>
      <div id="move" title="Перенести область" data-i18n-title="Перенести область">✛</div>
      <span id="size"></span>
    </div>
    <script src="../i18n/en.js"></script>
    <script src="../i18n/i18n.js"></script>
    <script src="region.js"></script>
  </body>
</html>
